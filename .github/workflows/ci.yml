name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    env:
      AGENT_API_KEY: ci-dummy
      REDIS_URL: "fake://"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: |
          pytest tests/ -v -m "not docker" --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t day12-agent:ci .

  deploy:
    name: Deploy to Production
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger deployment
        run: |
          echo "Deploying to production using secret token..."
          # Deploy hook or token is fetched securely from repository secrets
          curl -s -X POST "${{ secrets.DEPLOY_HOOK_URL }}" || true

      - name: Smoke test
        run: |
          echo "Smoke test placeholder"
